name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/k8s-deployment.yaml'
      - 'k8s/app/deployment.yaml'
      - 'k8s/app/playwright-hook.yaml'

env:
  PROJECT_ID: maram-pfe-495314
  REGION: europe-west9
  REPOSITORY: sopra-repo
  IMAGE: login-page
  GKE_CLUSTER: maram-cluster-terraform
  IMAGE_TAG: ${{ github.sha }}
  SERVICE_NAME: login-page
  PW_IMAGE: europe-west9-docker.pkg.dev/maram-pfe-495314/sopra-repo/playwright-tests

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Build the Docker image
  # ──────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            .

      - name: Save Docker image as artifact
        run: |
          docker save \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ──────────────────────────────────────────────
  # Stage 1B: SonarCloud — Code Quality & SAST
  # ──────────────────────────────────────────────
  sonarcloud:
    name: 🔎 SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npx vitest run --coverage --reporter=default || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────
  # Stage 2: Trivy — Image Vulnerability Scan
  # ──────────────────────────────────────────────
  trivy-scan:
    name: 🔍 Trivy Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Download Trivy HTML template
        if: always()
        run: |
          mkdir -p .trivy-templates
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o .trivy-templates/html.tpl

      - name: Run Trivy (HTML report)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          format: template
          template: '@.trivy-templates/html.tpl'
          output: trivy-report.html
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.html
          retention-days: 14

  # ──────────────────────────────────────────────
  # Stage 3: Push image to Artifact Registry
  # ──────────────────────────────────────────────
  push:
    name: 📦 Push to Artifact Registry
    runs-on: ubuntu-latest
    needs: trivy-scan
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

  # ──────────────────────────────────────────────
  # Stage 3B: Deploy to Cloud Run
  # ──────────────────────────────────────────────
  cloud-run-deploy:
    name: ☁️ Cloud Run Deploy
    runs-on: ubuntu-latest
    needs: push
    outputs:
      cloud_run_url: ${{ steps.url.outputs.cloud_run_url }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --quiet

      - name: Get Cloud Run URL
        id: url
        run: |
          CLOUD_RUN_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)')
          echo "Cloud Run URL: ${CLOUD_RUN_URL}"
          echo "cloud_run_url=${CLOUD_RUN_URL}" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────
  # Stage 4: Update K8s Manifests (GitOps)
  # ArgoCD watches this commit and deploys + runs PostSync hooks
  # ──────────────────────────────────────────────
  update-manifest:
    name: ✏️ Update Manifest
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in K8s manifests
        run: |
          FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}"
          PW_FULL_IMAGE="${{ env.PW_IMAGE }}:${{ env.IMAGE_TAG }}"

          # Update app deployment
          sed -i "s|image: .*login-page:.*|image: ${FULL_IMAGE}|" k8s/app/deployment.yaml

          # Update Playwright PostSync hook image tags
          sed -i "s|image: .*playwright-tests:.*|image: ${PW_FULL_IMAGE}|g" k8s/app/playwright-hook.yaml

          # Also keep terraform manifest in sync (legacy)
          sed -i "s|image: .*login-page:.*|image: ${FULL_IMAGE}|" terraform/k8s-deployment.yaml

          echo "--- Updated k8s/app/deployment.yaml ---"
          grep "image:" k8s/app/deployment.yaml
          echo "--- Updated k8s/app/playwright-hook.yaml ---"
          grep "image:" k8s/app/playwright-hook.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app/deployment.yaml k8s/app/playwright-hook.yaml terraform/k8s-deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ env.IMAGE_TAG }}"
          git push

  # ──────────────────────────────────────────────
  # Stage 5: ArgoCD Sync — Trigger sync via kubectl
  # (avoids argocd CLI permission issues)
  # ──────────────────────────────────────────────
  argocd-sync:
    name: 🔄 ArgoCD Sync
    runs-on: ubuntu-latest
    needs: update-manifest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Trigger ArgoCD sync via kubectl
        run: |
          # Force ArgoCD to refresh from Git immediately
          kubectl patch application login-page-replicator -n argocd \
            --type merge -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' || true
          sleep 5

          # Trigger a sync operation
          kubectl patch application login-page-replicator -n argocd --type merge -p '
          {
            "operation": {
              "initiatedBy": {"username": "github-actions"},
              "sync": {
                "revision": "HEAD",
                "prune": true
              }
            }
          }' || true
          sleep 10

      - name: Wait for ArgoCD sync to complete
        run: |
          echo "Waiting for ArgoCD to deploy image tag: ${{ env.IMAGE_TAG }}"
          FOUND=0
          for i in $(seq 1 60); do
            PHASE=$(kubectl get application login-page-replicator -n argocd \
              -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)
            SYNC=$(kubectl get application login-page-replicator -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            HEALTH=$(kubectl get application login-page-replicator -n argocd \
              -o jsonpath='{.status.health.status}' 2>/dev/null || true)

            echo "Attempt ${i}/60 — phase: ${PHASE}, sync: ${SYNC}, health: ${HEALTH}"

            if [ "${SYNC}" = "Synced" ] && [ "${HEALTH}" = "Healthy" ]; then
              FOUND=1
              break
            fi
            sleep 10
          done

          if [ "${FOUND}" -ne 1 ]; then
            echo "⚠️ Timed out waiting for sync, but continuing..."
          else
            echo "✅ ArgoCD sync completed successfully"
          fi

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/login-page -n sopra-hr --timeout=300s || true

  # ──────────────────────────────────────────────
  # Stage 5B: Build & Push Playwright Test Image
  # ──────────────────────────────────────────────
  build-playwright:
    name: 🎭 Build Test Image
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Playwright Docker image
        run: |
          docker build \
            -f Dockerfile.playwright \
            -t ${{ env.PW_IMAGE }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.PW_IMAGE }}:latest \
            .

      - name: Push Playwright Docker image
        run: |
          docker push ${{ env.PW_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.PW_IMAGE }}:latest

  # ──────────────────────────────────────────────
  # Stage 5C: Playwright E2E Tests (parallel via ArgoCD PostSync hooks)
  # Waits for each hook job to complete and collects results
  # ──────────────────────────────────────────────
  playwright-e2e:
    name: 🎭 E2E Tests — ${{ matrix.test_id }}
    runs-on: ubuntu-latest
    needs: [argocd-sync, build-playwright]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_id: t1
            job_name: playwright-e2e-tests-t1
          - test_id: t2
            job_name: playwright-e2e-tests-t2
          - test_id: t3
            job_name: playwright-e2e-tests-t3
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Wait for PostSync hook job
        run: |
          JOB_NAME="${{ matrix.job_name }}"
          echo "Waiting for ArgoCD PostSync hook: ${JOB_NAME}..."

          # Wait for job to appear (ArgoCD creates it after sync)
          for i in $(seq 1 60); do
            if kubectl get job "${JOB_NAME}" -n sopra-hr &>/dev/null; then
              echo "✅ Job ${JOB_NAME} found"
              break
            fi
            echo "Attempt ${i}/60 — job not yet created..."
            sleep 5
          done

          kubectl get job "${JOB_NAME}" -n sopra-hr || \
            { echo "❌ Job never appeared"; exit 1; }

          # Wait for job to finish
          echo "Waiting for ${JOB_NAME} to complete..."
          kubectl wait --for=condition=complete job/${JOB_NAME} \
            -n sopra-hr --timeout=600s || true

      - name: Get test logs and check result
        if: always()
        run: |
          JOB_NAME="${{ matrix.job_name }}"

          echo "=== Test Logs for ${JOB_NAME} ==="
          kubectl logs -l job-name="${JOB_NAME}" -n sopra-hr 2>/dev/null | \
            sed '/---PLAYWRIGHT-ARTIFACTS-START---/,$d' || true

          # Check job status
          COMPLETE=$(kubectl get job "${JOB_NAME}" -n sopra-hr \
            -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
          FAILED=$(kubectl get job "${JOB_NAME}" -n sopra-hr \
            -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)

          if [ "${COMPLETE}" = "True" ]; then
            echo "✅ Test ${JOB_NAME} passed!"
          elif [ "${FAILED}" = "True" ]; then
            echo "❌ Test ${JOB_NAME} failed!"
            exit 1
          else
            echo "⚠️ Test ${JOB_NAME} status unknown"
            exit 1
          fi

      - name: Extract artifacts from logs
        if: always()
        run: |
          JOB_NAME="${{ matrix.job_name }}"
          mkdir -p artifacts

          kubectl logs -l job-name="${JOB_NAME}" -n sopra-hr 2>/dev/null > /tmp/pod-logs.txt || true

          # Extract base64 tarball
          sed -n '/---PLAYWRIGHT-ARTIFACTS-START---/,/---PLAYWRIGHT-ARTIFACTS-END---/p' \
            /tmp/pod-logs.txt | grep -v '^---PLAYWRIGHT-ARTIFACTS' > /tmp/artifacts.b64

          if [ -s /tmp/artifacts.b64 ]; then
            echo "Extracting artifact tarball..."
            base64 -d /tmp/artifacts.b64 | tar -xzf - -C artifacts/ || true
            find artifacts/ -type f | head -20
          else
            echo "⚠️ No artifact tarball found"
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.test_id }}-${{ github.run_id }}
          path: |
            artifacts/playwright-report/
            artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14

  # ──────────────────────────────────────────────
  # Stage 6: OWASP ZAP — DAST Scan
  # ──────────────────────────────────────────────
  zap-scan:
    name: 🛡️ OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: [argocd-sync, playwright-e2e]
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Port-forward app
        run: |
          kubectl port-forward svc/login-page-service 8080:80 -n sopra-hr &
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          retention-days: 14
